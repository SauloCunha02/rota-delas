name: Publicar Rota Delas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter projeto
        uses: actions/checkout@v7.0.1
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Validar e gerar catálogo nacional
        run: node scripts/gerar-catalogo.mjs
      - name: Validar e gerar missões e agenda
        run: node scripts/gerar-jornada.mjs
      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
